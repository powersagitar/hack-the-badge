[package]
name = "emulator-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "emulator_core"
path = "src/lib.rs"

[dependencies]
md-5 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf"] }
png = "0.17"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
